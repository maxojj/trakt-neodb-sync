name: 豆瓣 → NeoDB 同步

on:
  schedule:
    # 每 6 小时跑一次（UTC 0/6/12/18 点），豆瓣 RSS 只保留最近 10 条，跑勤一点防漏
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: 同步豆瓣标记到 NeoDB

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          DOUBAN_ID: ${{ secrets.DOUBAN_ID }}
          NEODB_TOKEN: ${{ secrets.NEODB_TOKEN }}
        run: python sync.py

      - name: Commit synced record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synced.json
          if git diff --cached --quiet; then
            echo "没有新的同步记录"
          else
            git commit -m "chore: update synced.json"
            git push
          fi
