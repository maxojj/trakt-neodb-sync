name: Trakt to NeoDB Sync

on:
  schedule:
    # 每3天 UTC 02:00 运行
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Restore last sync timestamp
        uses: actions/cache@v4
        with:
          path: .last_sync
          key: last-sync-${{ github.run_id }}
          restore-keys: |
            last-sync-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_ACCESS_TOKEN: ${{ secrets.TRAKT_ACCESS_TOKEN }}
          NEODB_ACCESS_TOKEN: ${{ secrets.NEODB_ACCESS_TOKEN }}
          TRAKT_USERNAME: ${{ secrets.TRAKT_USERNAME }}
        run: python sync.py
